<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poverty Scalper - Mobile Trading Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-card {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            color: #f97316;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            border-color: #f97316;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s active;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background: #22c55e;
            color: #ffffff;
        }

        .btn-stop {
            background: #ef4444;
            color: #ffffff;
        }

        .status-card {
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #334155;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .row span {
            color: #94a3b8;
        }

        .signal-badge {
            text-align: center;
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            background: #334155;
            color: #94a3b8;
            letter-spacing: 1px;
            transition: background 0.3s ease, color 0.3s ease;
        }
    </style>
</head>
<body>

<div class="mobile-card">
    <div class="header">
        <h2>Poverty Scalper</h2>
        <p>Mobile Signal Engine Dashboard</p>
    </div>

    <div class="form-group">
        <label for="symbol">Trading Symbol</label>
        <select id="symbol">
            <option value="XAUUSD">XAUUSD (Gold)</option>
            <option value="EURUSD">EURUSD</option>
            <option value="GBPUSD">GBPUSD</option>
            <option value="US30">US30</option>
        </select>
    </div>

    <div class="form-group">
        <label for="lot">Lot Size</label>
        <input type="number" id="lot" value="0.40" step="0.01" min="0.01">
    </div>

    <div class="form-group">
        <label for="maxTrades">Max Open Trades</label>
        <input type="number" id="maxTrades" value="4" min="1" max="10">
    </div>

    <div class="btn-grid">
        <button class="btn-start" onclick="startBot()">START BOT</button>
        <button class="btn-stop" onclick="stopBot()">STOP BOT</button>
    </div>

    <div class="status-card">
        <div class="row">
            <span>Engine Status:</span>
            <strong id="status" style="color: #ef4444;">OFFLINE</strong>
        </div>
        <div class="row">
            <span>Current Price:</span>
            <strong id="price">--</strong>
        </div>
        <div class="row">
            <span>RSI Indicator:</span>
            <strong id="rsi">--</strong>
        </div>
        <div class="signal-badge" id="signal">NEUTRAL</div>
    </div>
</div>

<script>
    // Automatic Protocol Selection (WebSocket / WebSockets secure)
    const host = location.host || "localhost:8000";
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${host}/ws`);

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        document.getElementById("price").innerText = data.price ?? "--";
        document.getElementById("rsi").innerText = data.rsi ?? "--";
        
        const statusElem = document.getElementById("status");
        if (data.bot_active) {
            statusElem.innerText = "RUNNING";
            statusElem.style.color = "#22c55e";
        } else {
            statusElem.innerText = "STOPPED";
            statusElem.style.color = "#ef4444";
        }
        
        const sigElem = document.getElementById("signal");
        sigElem.innerText = data.signal || "NEUTRAL";
        
        if (data.signal === "BUY") {
            sigElem.style.background = "#22c55e";
            sigElem.style.color = "#ffffff";
        } else if (data.signal === "SELL") {
            sigElem.style.background = "#ef4444";
            sigElem.style.color = "#ffffff";
        } else {
            sigElem.style.background = "#334155";
            sigElem.style.color = "#94a3b8";
        }
    };

    ws.onerror = (err) => {
        console.error("WebSocket Connection Error:", err);
        document.getElementById("status").innerText = "DISCONNECTED";
        document.getElementById("status").style.color = "#ef4444";
    };

    async function startBot() {
        const symbol = document.getElementById("symbol").value;
        const lot = document.getElementById("lot").value;
        const maxTrades = document.getElementById("maxTrades").value;
        
        try {
            await fetch(`/api/start?symbol=${symbol}&lot_size=${lot}&max_trades=${maxTrades}`, { 
                method: "POST" 
            });
        } catch(e) {
            console.error("Failed to send start request", e);
        }
    }

    async function stopBot() {
        try {
            await fetch("/api/stop", { method: "POST" });
        } catch(e) {
            console.error("Failed to send stop request", e);
        }
    }
</script>

</body>
</html>
